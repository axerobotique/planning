services:
  - type: web
    name: planning-ara
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    envVars:
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/google-credentials.json
      - key: SECRET_KEY
        generateValue: true
      - key: HEURES_ADMIN_PASSWORD
        sync: false
      - key: HEURES_INITIAL_PASSWORD
        sync: false
