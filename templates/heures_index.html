<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Feuilles d'heures — Planning atelier</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>" />
  <link rel="stylesheet" href="{{ url_for('static', filename='planning.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='heures.css') }}">
  <script>
    try { if (localStorage.getItem("planning-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <h1>Feuilles d'heures</h1>
    <nav class="nav">
      <a class="btn" href="{{ url_for('planning') }}">&larr; Planning</a>
      <button type="button" class="btn" id="btn-theme" title="Passer en mode sombre">&#9790; Mode sombre</button>
    </nav>
  </header>

  <main class="hr-wrap">
    <p class="hr-intro">Choisis ton nom pour saisir tes heures. Enregistre la page dans tes favoris pour y revenir directement.</p>
    <ul class="hr-emp-list">
      {% for name in employees %}
        <li><a class="hr-emp-link" href="{{ url_for('heures_employee', employee=name) }}">{{ name }}</a></li>
      {% else %}
        <li class="hr-empty">Aucun salarié trouvé dans le planning.</li>
      {% endfor %}
    </ul>
  </main>

  <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
